name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build universal DMG
        run: make -j2 dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarlinkViz-macOS-universal
          path: dist/*.dmg

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/*.dmg \
            --title "StarlinkViz $TAG" \
            --generate-notes
